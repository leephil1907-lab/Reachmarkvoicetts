name: Voice Lab checks

on:
  pull_request:
    paths:
      - 'admin/**'
      - 'voice-worker/**'
      - '.github/workflows/voice-lab-checks.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check JavaScript syntax
        run: |
          node --check admin/server.js
          node --check admin/web/admin.js
          node --check admin/web/voice-lab.js
          node --check web/sw.js
      - name: Check Python syntax
        run: python -m py_compile voice-worker/app.py
